[project]
name = "fake-news-etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hayette", email = "bouzouita.hayette@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
fake-news-etl = "fake_news_etl:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]